name: Build original tools

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build patcher
        run: dotnet build src/ExtendedChest.Patcher/ExtendedChest.Patcher.csproj --configuration Release
      - name: Build resource extractor
        run: dotnet build tools/ResourceExtractor/ResourceExtractor.csproj --configuration Release
      - name: Enforce source-only repository
        shell: pwsh
        run: |
          $forbidden = git ls-files | Where-Object {
            $_ -match '(?i)(^|/)(Content|lib64)/' -or
            $_ -match '(?i)(^|/)(Terraria(Server)?|steam_appid\.txt|monoconfig|monomachineconfig)$' -or
            $_ -match '(?i)\.(exe|dll|so(\.[^/]+)?|bin\.x86_64)$'
          }
          if ($forbidden) { throw "Forbidden compiled or proprietary files tracked:`n$($forbidden -join "`n")" }
